# Shared IdP test fixtures — one compose file for every language suite
# (Python root, /go, /rust). Start only the provider(s) a target needs:
#
#   docker compose -f infra/docker-compose.yml up -d --build --wait node-oidc-provider
#   docker compose -f infra/docker-compose.yml up -d --build --wait keycloak
#   docker compose -f infra/docker-compose.yml up -d --build --wait   # everything
#
# `make infra-up` / `make infra-down` wrap the node-oidc-provider +
# identityserver pair the Go/Rust suites default to. See infra/README.md.
services:
  node-oidc-provider:
    build:
      context: ./node-oidc-provider
      dockerfile: Dockerfile
      # Canned spec vectors served under /v/ (vectors.js).
      additional_contexts:
        spec: ../spec
    container_name: node-oidc-provider
    ports:
      - "127.0.0.1:9010:9010"
    environment:
      - ISSUER=http://localhost:9010
      - PORT=9010
      - SPEC_DIR=/spec
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9010/.well-known/openid-configuration"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 3s

  identityserver:
    build:
      context: ./identityserver
      dockerfile: Dockerfile
    container_name: identityserver
    ports:
      - "127.0.0.1:9001:9001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:9001
      - ISSUER=http://localhost:9001
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9001/.well-known/openid-configuration"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    container_name: keycloak-provider
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Keycloak 26+ bootstrap admin variable names (KEYCLOAK_ADMIN* are deprecated).
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    healthcheck:
      # The Keycloak ubi9 image ships bash but no wget/curl. Probe the IMPORTED
      # realm's discovery document over bash's /dev/tcp so `--wait` (and any
      # `depends_on: service_healthy`) only turns green AFTER --import-realm has
      # finished. A plain TCP-on-8080 check would go healthy before the realm
      # exists and race downstream integration tests.
      #
      # /dev/tcp is a bash-only feature, so invoke `bash -c` explicitly rather
      # than relying on CMD-SHELL's /bin/sh. The status match is anchored to the
      # HTTP status line (^HTTP/1.x 200) so it can't be fooled by a "200 OK"
      # substring appearing elsewhere in the response body.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - >-
          exec 3<>/dev/tcp/localhost/8080 &&
          printf 'GET /realms/py-identity-model/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -qE '^HTTP/1\.[01] 200' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
