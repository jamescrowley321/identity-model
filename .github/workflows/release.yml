name: Release

on:
  push:
    branches:
      - main
    # The commit-parser scope routing (tools/release_parsers.py) is what keeps
    # cross-track commits from bumping py-identity-model — the core `release`
    # job's parser drops every (fastapi)/(go)/(rust)/(node)/(spec)/(infra)
    # commit. go/** and rust/** are deliberately NOT ignored here: their own
    # version jobs (release-go-version / release-rust-version) live in this
    # workflow and MUST run on native-only pushes to auto-tag their releases.
    # Pushes touching ONLY the shared spec/infra or the inert node scaffold have
    # no versioner, so they skip the workflow entirely.
    paths-ignore:
      - 'node/**'
      - 'spec/**'
      - 'infra/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.inputs.branch || github.ref_name }}
      run-descope-integration: true
      run-example-tests: true
      run-build: true
    secrets: inherit

  # OIDF RP conformance must pass before anything is tagged or published.
  # The whole release chain (release → fastapi → go → rust) hangs off the
  # `release` job below, so gating that one job on conformance gates them all.
  # This reusable call also runs on every push to main (release.yml's trigger),
  # which is why conformance.yml no longer needs its own push-to-main trigger.
  conformance:
    uses: ./.github/workflows/conformance.yml

  release:
    needs: [ci, conformance]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: write # semantic-release commits the version bump + pushes the tag

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: make ci-setup

      - name: Determine branch name
        id: branch
        run: |
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          echo "name=$BRANCH" >> $GITHUB_OUTPUT
          if [[ "$BRANCH" == "main" ]]; then
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      # Run python-semantic-release via uvx (not the Docker action) so we can
      # constrain GitPython. PSR declares a loose `gitpython~=3.0`, so without a
      # bound here the release resolves it freely.
      #
      # The bound is a FLOOR. It used to be the ceiling `<3.1.60`, because PSR
      # 10.6.1 called `Actor.name_email_regex` and GitPython removed it in
      # 3.1.60 (green at 3.1.59 on 2026-08-22; broke by 2026-08-28). That is
      # obsolete twice over: PSR 10.6.2 no longer references the attribute, and
      # GitPython restored it (deprecated) by 3.1.62. Keeping the ceiling had
      # become the bigger risk — it held GitPython at <=3.1.59, one resolver
      # preference away from <=3.1.58, which carries a CRITICAL RCE advisory
      # (GHSA-284h-m62q-gf8w) and two highs (GHSA-7833-fr7j-v32q,
      # GHSA-8mcc-hrx5-hvxc), all first patched in 3.1.59. Hence `>=3.1.59`.
      #
      # The same pins live in py/pyproject.toml's `tools` dependency group, which
      # is what `make test-tools` runs against; tools/tests/test_release_tooling_pins.py
      # fails if this file and that group ever disagree.
      #
      # Config (pyproject.toml, release_parsers.py, CHANGELOG.md, tag_format
      # `py-v{version}`) resolves from working-dir py/.
      - name: Semantic Version Release
        id: release
        working-directory: py
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }} # PSR uses this for the VCS release + push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"
          before="$(git tag -l 'py-v*' | sort -V | tail -1)"
          uvx --from "python-semantic-release==10.6.2" --with "gitpython>=3.1.59" \
            semantic-release -v version
          after="$(git tag -l 'py-v*' | sort -V | tail -1)"
          if [ -n "$after" ] && [ "$before" != "$after" ]; then
            {
              echo "released=true"
              echo "tag=$after"
              echo "version=${after#py-v}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync uv.lock with released version
        if: steps.release.outputs.released == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          (cd py && uv lock)
          if git diff --quiet py/uv.lock; then
            echo "uv.lock already up to date"
          else
            git add py/uv.lock
            git commit -m "chore: sync uv.lock with ${{ steps.release.outputs.version }}"
            git push
          fi

      - name: Build distribution
        if: steps.release.outputs.released == 'true'
        run: |
          echo "Building version ${{ steps.release.outputs.version }}"
          # Ensure version is set in pyproject.toml (semantic-release should have done this,
          # but we verify/set it explicitly to be safe)
          # Anchor to the project.version line: an unanchored `s/0.0.0/<ver>/`
          # also matches the `0.0.0` inside dependency pins (e.g.
          # `cryptography>=50.0.0`), rewriting it to `cryptography>=5<ver>` and
          # breaking the build (this froze every cryptography>=50 release).
          sed -i -e "s/^version = \"0.0.0\"/version = \"${{ steps.release.outputs.version }}\"/" py/pyproject.toml
          make build-dist

      # Replaces publish-action (also PSR-based, same GitPython break): attach the
      # built dist to the VCS release that `semantic-release version` created. If
      # for any reason the release object is absent, create it first so the upload
      # never fails on the missing-release path.
      - name: Upload to GitHub Release Assets
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" py/dist/* --clobber

      # Publishing to PyPI is handled by publish-dist.yml, which is triggered by
      # the py-v{version} tag semantic-release pushes above (via RELEASE_TOKEN, a
      # PAT, so the tag push triggers downstream workflows). That job publishes
      # via OIDC Trusted Publishing. Keeping the upload here too would be a
      # redundant second publish, so it was removed (uv publish is idempotent,
      # but one source of truth is clearer).

      - name: Release Summary
        if: steps.release.outputs.released == 'true'
        run: |
          echo "## Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ steps.branch.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.branch.outputs.is_prerelease }}" == "true" ]]; then
            echo "This is a **prerelease** version." >> $GITHUB_STEP_SUMMARY
          else
            echo "This is a **stable** release." >> $GITHUB_STEP_SUMMARY
          fi

      - name: No Release Needed
        if: steps.release.outputs.released != 'true'
        run: |
          echo "## No Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No release was created. This can happen if:" >> $GITHUB_STEP_SUMMARY
          echo "- There are no releasable commits (commits must follow conventional commit format)" >> $GITHUB_STEP_SUMMARY
          echo "- The version would not change based on the commits" >> $GITHUB_STEP_SUMMARY

  # Version the fastapi-identity-model package from "(fastapi)"-scoped commits
  # (scope routing: tools/release_parsers.py; config: the package's
  # pyproject.toml). Runs AFTER the core release job so the two pipelines never
  # push to main concurrently. When it cuts a version, the PAT-pushed
  # fastapi-identity-model-v* tag triggers release-fastapi.yml, which builds
  # and publishes to PyPI via trusted publishing. Main-only: the package config
  # has no prerelease branch group, so other branches must not run it.
  release-fastapi-version:
    needs: release
    if: ${{ (github.event.inputs.branch || github.ref_name) == 'main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-fastapi-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Sync with commits pushed by the core release job
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Version fastapi-identity-model
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions <actions@users.noreply.github.com>"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          # Run from py/ so the package config, its commit parser
          # (tools/release_parsers.py) and version_toml resolve under py/ (CONS-2.1).
          # Floor gitpython>=3.1.59 (same as the core release job): PSR's loose
          # gitpython~=3.0 otherwise allows <=3.1.58, which carries a critical
          # RCE advisory. See the core job for the full rationale.
          cd py && uvx --from python-semantic-release==10.6.2 --with "gitpython>=3.1.59" semantic-release \
            -c packages/fastapi-identity-model/pyproject.toml version

  # Version the Go library (identity-model/go) from "(go)"-scoped commits. A Go
  # library has no version file — the version IS the go/v{version} tag — so
  # semantic-release reads the current version from the latest go/v* tag and
  # pushes a new one (config: tools/semantic-release-go.toml; scope routing:
  # tools/release_parsers.py:GoCommitParser). The pushed tag then triggers
  # release-go.yml (build/verify + GitHub Release). Chained AFTER the fastapi
  # job so the release pipelines never push to main concurrently.
  # `--no-vcs-release`: release-go.yml owns the GitHub Release, so PSR here only
  # commits the changelog and pushes the tag. Main-only.
  release-go-version:
    needs: release-fastapi-version
    if: ${{ (github.event.inputs.branch || github.ref_name) == 'main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-go-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Sync with commits pushed by earlier release jobs
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Version the Go library
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions <actions@users.noreply.github.com>"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          # Run from the repo ROOT (not py/) so the go/ and tools/ paths in
          # the config resolve directly. Floor gitpython>=3.1.59 (same reason as
          # the core job): PSR's loose gitpython~=3.0 otherwise allows <=3.1.58,
          # which carries a critical RCE advisory.
          uvx --from python-semantic-release==10.6.2 --with "gitpython>=3.1.59" semantic-release \
            -c tools/semantic-release-go.toml version --no-vcs-release

  # Version the Rust crate (rs-identity-model) from "(rust)"-scoped commits:
  # bump rust/Cargo.toml and push a rust-v{version} tag (config:
  # tools/semantic-release-rust.toml; scope routing:
  # tools/release_parsers.py:RustCommitParser). The pushed tag triggers
  # release-rust.yml, which publishes the crate to crates.io. Chained AFTER the
  # go job (last writer in the serial release chain). `--no-vcs-release`:
  # release-rust.yml owns the GitHub Release. Main-only.
  release-rust-version:
    needs: release-go-version
    if: ${{ (github.event.inputs.branch || github.ref_name) == 'main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-rust-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Sync with commits pushed by earlier release jobs
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Version the Rust crate
        id: rust
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions <actions@users.noreply.github.com>"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          before="$(git tag -l 'rust-v*' | sort -V | tail -1)"
          # Run from the repo ROOT so the rust/ and tools/ paths resolve.
          # Floor gitpython>=3.1.59 (see the core job for the rationale).
          uvx --from python-semantic-release==10.6.2 --with "gitpython>=3.1.59" semantic-release \
            -c tools/semantic-release-rust.toml version --no-vcs-release
          after="$(git tag -l 'rust-v*' | sort -V | tail -1)"
          if [ -n "$after" ] && [ "$before" != "$after" ]; then
            {
              echo "released=true"
              echo "version=${after#rust-v}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # rust/Cargo.lock is synced INSIDE the version commit, by PSR's
      # build_command (tools/sync_cargo_lock_version.py) with the lock listed
      # in `assets` — see tools/semantic-release-rust.toml. A follow-up sync
      # commit, which is what this job used to do, lands after the rust-v* tag
      # has already been placed, so the tagged tree keeps a lock one version
      # behind the manifest; release-rust.yml's `cargo build` then rewrites it
      # and `cargo publish` aborts on the dirty tree (exit 101). That is why
      # rust-v0.1.0 through rust-v0.3.1 never reached crates.io.
      #
      # This step asserts the invariant that failure taught us, at the moment
      # the tag is cut rather than in the downstream publish workflow: the tag
      # must point at the version commit, and that commit's lock must already
      # agree with its manifest.
      - name: Verify the tagged release commit is publishable
        if: steps.rust.outputs.released == 'true'
        run: |
          tag="rust-v${{ steps.rust.outputs.version }}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "$tag^{commit}")" ]; then
            echo "::error::$tag does not point at the version commit just created"
            exit 1
          fi
          python3 tools/sync_cargo_lock_version.py --check
