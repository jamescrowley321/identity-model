name: Release Rust 🦀

# The Rust crate (rs-identity-model) versions on its own cadence. A release is
# a `rust-vX.Y.Z` tag whose version matches rust/Cargo.toml; this workflow
# publishes the crate to crates.io and cuts a GitHub Release. Create one with
# cargo-release locally, or:  git tag rust-v0.0.1 && git push origin rust-v0.0.1
# (after bumping rust/Cargo.toml to the same version).
on:
  push:
    tags:
      - 'rust-v*'

# Least-privilege default; the release job elevates to contents: write.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the crate release and cut a GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Verify the tag matches Cargo.toml version
        id: version
        working-directory: rust
        run: |
          tag_version="${GITHUB_REF_NAME#rust-v}"
          crate_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag '$tag_version' does not match rust/Cargo.toml version '$crate_version'"
            exit 1
          fi
          echo "version=$crate_version" >> "$GITHUB_OUTPUT"
          echo "Releasing rs-identity-model $crate_version"

      # A tag whose Cargo.lock lags its Cargo.toml is unpublishable: the first
      # cargo invocation rewrites the lock and `cargo publish` then refuses the
      # dirty tree ("uncommitted changes: Cargo.lock", exit 101). Every rust-v*
      # tag from 0.1.0 to 0.3.1 died there, several minutes into the job with an
      # error that names the symptom and not the cause. Fail here instead, in
      # seconds, saying which file is stale and why.
      - name: Verify Cargo.lock matches the tagged version
        run: python3 tools/sync_cargo_lock_version.py --check

      # --locked throughout: cargo must publish exactly the dependency graph the
      # tag recorded, and cannot silently rewrite the lockfile out from under the
      # publish step.
      - name: Build and test
        working-directory: rust
        run: |
          cargo build --release --locked
          cargo test --locked

      - name: Publish to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Rust ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Rust crate release `${{ github.ref_name }}` — published to crates.io as `rs-identity-model`.

            ```toml
            [dependencies]
            rs-identity-model = "${{ steps.version.outputs.version }}"
            ```
