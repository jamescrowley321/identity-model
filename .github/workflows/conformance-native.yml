name: Conformance (Native)

# OIDF RP conformance for the native Go and Rust harnesses, through
# `make conformance-test-native`. A harness exists once its compose overlay
# (conformance/docker-compose.<harness>.yml) does; until then its leg skips.
# See conformance/adding-conformance-profiles.md, "Native RP harnesses".

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main, release/v5]
  workflow_dispatch:
    inputs:
      harness:
        description: "Native harness to run against the hosted suite"
        type: choice
        required: true
        options:
          - go
          - rust
      publish:
        description: "Publish results on the public certification.openid.net list"
        type: choice
        default: none
        options:
          - none
          - summary
          - everything

jobs:
  local:
    if: github.event_name != 'workflow_dispatch'
    name: local (${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        harness: [go, rust]
    env:
      HARNESS: ${{ matrix.harness }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for harness overlay
        id: overlay
        run: |
          if [ -f "conformance/docker-compose.$HARNESS.yml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::conformance/docker-compose.$HARNESS.yml does not exist; skipping the $HARNESS harness"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.overlay.outputs.present == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.overlay.outputs.present == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install test runner dependencies
        if: steps.overlay.outputs.present == 'true'
        run: uv pip install --system httpx cryptography

      # Drop committed results first so a plan that never writes its JSON
      # cannot upload a stale pass. UVROOT= runs the runner on the system
      # Python set up above instead of syncing the whole uv workspace.
      - name: Run native conformance plans
        if: steps.overlay.outputs.present == 'true'
        run: |
          rm -f conformance/results/"$HARNESS"-*-latest.json
          make conformance-test-native HARNESS="$HARNESS" UVROOT=

      - name: Collect suite and harness logs
        if: always() && steps.overlay.outputs.present == 'true'
        run: |
          mkdir -p conformance/results/logs
          docker compose -f conformance/docker-compose.yml -f "conformance/docker-compose.$HARNESS.yml" \
            logs > "conformance/results/logs/$HARNESS-compose.log" 2>&1 || true

      - name: Upload conformance results
        if: always() && steps.overlay.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-native-${{ matrix.harness }}-results
          path: |
            conformance/results/${{ matrix.harness }}-*-latest.json
            conformance/results/logs/
          retention-days: 30

      - name: Teardown
        if: always() && steps.overlay.outputs.present == 'true'
        run: docker compose -f conformance/docker-compose.yml -f "conformance/docker-compose.$HARNESS.yml" down -v

  hosted:
    if: github.event_name == 'workflow_dispatch'
    name: hosted (${{ inputs.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Shares conformance-hosted.yml's group: one run at a time against the
    # shared hosted account, never cancelled mid-plan.
    concurrency:
      group: conformance-hosted
      cancel-in-progress: false
    env:
      HARNESS: ${{ inputs.harness }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for harness overlay
        run: |
          if [ ! -f "conformance/docker-compose.$HARNESS.yml" ]; then
            echo "::error::conformance/docker-compose.$HARNESS.yml does not exist; the $HARNESS harness has not landed"
            exit 1
          fi

      # A stale token makes the suite answer 302 -> login, which surfaces much
      # later as an opaque HTTP error. Fail up front with the actual cause.
      - name: Check CONFORMANCE_TOKEN
        env:
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: |
          if [ -z "$CONFORMANCE_TOKEN" ]; then
            echo "::error::CONFORMANCE_TOKEN secret is not set"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CONFORMANCE_TOKEN" \
            https://www.certification.openid.net/api/plan)
          if [ "$status" != "200" ]; then
            echo "::error::certification.openid.net rejected CONFORMANCE_TOKEN (HTTP $status); generate a new token and update the secret"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install test runner dependencies
        run: uv pip install --system httpx cryptography

      - name: Run native conformance plans
        env:
          CONFORMANCE_SERVER: https://www.certification.openid.net/
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          rm -f conformance/results/hosted/"$HARNESS"-*-latest.json
          make conformance-test-native HARNESS="$HARNESS" HOSTED=1 UVROOT=

      - name: Collect harness logs
        if: always()
        run: |
          mkdir -p conformance/results/logs
          docker compose -f conformance/docker-compose.yml -f "conformance/docker-compose.$HARNESS.yml" \
            logs > "conformance/results/logs/$HARNESS-compose.log" 2>&1 || true

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-native-${{ inputs.harness }}-hosted-results
          path: |
            conformance/results/hosted/${{ inputs.harness }}-*-latest.json
            conformance/results/hosted/${{ inputs.harness }}-*-export.zip
            conformance/results/hosted/${{ inputs.harness }}-*-rp-logs.zip
            conformance/results/logs/
          retention-days: 30

      - name: Teardown
        if: always()
        run: docker compose -f conformance/docker-compose.yml -f "conformance/docker-compose.$HARNESS.yml" down -v
