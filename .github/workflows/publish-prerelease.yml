name: Publish Pre-release to GitHub 🚀

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# Cancel any in-progress Publish Pre-release run on the same PR ref
# when a new commit lands. Avoids stacked CI runs on rapid pushes.
concurrency:
  group: publish-prerelease-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      run-descope-integration: true
      run-example-tests: true
      run-build: true
      # Ory integration runs in build.yml on the same push; skipping it
      # here eliminates duplicate concurrent hits to Ory's rate-limited
      # discovery/JWKS endpoints, which was the dominant cause of
      # integration-tests-ory 429s on PRs.
      run-ory-integration: false
    secrets: inherit

  publish-prerelease:
    needs: ci
    runs-on: ubuntu-latest
    # Only run on PRs from the same repo (not forks) to have access to secrets/permissions
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Install dependencies
        run: make ci-setup

      - name: Generate prerelease version
        id: vars
        run: |
          # Latest STABLE Python release tag. Python tags are py-v{version}
          # (CONS-2.2); select those explicitly so we never pick up a
          # fastapi-identity-model-v* tag or a prerelease, then strip the prefix.
          LATEST_TAG=$(git tag -l 'py-v[0-9]*.[0-9]*.[0-9]*' | grep -vE -- '-(rc|a|b)' | sort -V | tail -1)
          CURRENT_VERSION="${LATEST_TAG#py-v}"
          CURRENT_VERSION="${CURRENT_VERSION:-0.0.0}"

          # Parse current version and determine next version based on conventional commits
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}

          # Analyze commits to determine version bump type
          COMMITS=$(git log --format="%s" ${BASE_SHA}..${HEAD_SHA})

          # Determine bump type based on conventional commits
          if echo "$COMMITS" | grep -qE "^(feat|fix|perf)(\(.+\))?!:|^BREAKING CHANGE:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qE "^(fix|perf)(\(.+\))?:"; then
            BUMP="patch"
          else
            BUMP="patch"
          fi

          # Parse current version and bump it
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          # Create prerelease version with PR number and short SHA
          PR_NUMBER=${{ github.event.pull_request.number }}
          SHORT_SHA=$(echo $HEAD_SHA | cut -c1-7)
          VERSION="${MAJOR}.${MINOR}.${PATCH}-rc.${PR_NUMBER}.${SHORT_SHA}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Display version
        run: echo "Publishing version ${{ steps.vars.outputs.version }} to GitHub Releases"

      - name: Build distribution 📦
        run: |
          echo ${{ steps.vars.outputs.version }}
          # Anchor to the project.version line: the previous unanchored
          # `s/0.0.0/<ver>/` also matched the `0.0.0` inside any dependency
          # pin (e.g. `cryptography>=50.0.0`), corrupting pyproject.toml.
          sed -i -e "s/^version = \"0.0.0\"/version = \"${{ steps.vars.outputs.version }}\"/" py/pyproject.toml
          make build-dist

      - name: Get wheel filename
        id: wheel
        run: echo "filename=$(ls py/dist/*.whl | xargs -n 1 basename)" >> $GITHUB_OUTPUT

      - name: Delete existing prerelease for this PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find and delete any existing prerelease for this PR
          PR_NUMBER=${{ github.event.pull_request.number }}
          EXISTING_RELEASES=$(gh release list --json tagName,isPrerelease -q ".[] | select(.isPrerelease and (.tagName | contains(\"-rc.${PR_NUMBER}.\"))) | .tagName")
          for tag in $EXISTING_RELEASES; do
            echo "Deleting existing prerelease: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          prerelease: true
          files: py/dist/*
          body: |
            ## Pre-release ${{ steps.vars.outputs.version }}

            This is an automated pre-release from PR #${{ github.event.pull_request.number }}: **${{ github.event.pull_request.title }}**

            **PR:** ${{ github.event.pull_request.html_url }}

            ### Installation for Testing

            **Option 1: Install from GitHub Release (Recommended)**
            ```bash
            # Using pip
            pip install https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.version }}/${{ steps.wheel.outputs.filename }}

            # Using uv
            uv pip install https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.version }}/${{ steps.wheel.outputs.filename }}
            ```

            **Option 2: Install from PR branch**
            ```bash
            # Using pip
            pip install git+https://github.com/${{ github.repository }}.git@${{ github.event.pull_request.head.ref }}

            # Using uv
            uv pip install "git+https://github.com/${{ github.repository }}.git@${{ github.event.pull_request.head.ref }}#subdirectory=py"
            ```

            ---

            ⚠️ **This is a pre-release version.** Do not use in production.

            For production use, install the stable version from PyPI:
            ```bash
            pip install py-identity-model
            ```

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const version = '${{ steps.vars.outputs.version }}';
            const wheelFilename = '${{ steps.wheel.outputs.filename }}';
            const repo = context.repo.owner + '/' + context.repo.repo;

            const body = `## 🚀 Pre-release Published

            **Version:** \`${version}\`

            ### Quick Install
            \`\`\`bash
            pip install https://github.com/${repo}/releases/download/${version}/${wheelFilename}
            \`\`\`

            Or with uv:
            \`\`\`bash
            uv pip install https://github.com/${repo}/releases/download/${version}/${wheelFilename}
            \`\`\`

            [View Release](https://github.com/${repo}/releases/tag/${version})`;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Pre-release Published')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
