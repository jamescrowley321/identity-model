# Blind Peer Review — fresh-context, diff-only AI PR review. ON DEMAND ONLY.
# https://github.com/jamescrowley321/blind-peer-review
#
# This does NOT run automatically on pull requests, and "Merge Gate" is NOT a
# required check. Routine review happens locally, before the push, running the
# same lens library as isolated Claude Code subagents:
#
#     /plugin marketplace add jamescrowley321/blind-peer-review
#     /plugin install blind-peer-review
#     /blind-peer-review:check     # reviews the working diff against origin/main
#
# This workflow stays for the times a cloud second opinion is wanted on an open
# PR: run it from the Actions tab with the PR number.
#
# Why it is not automatic: the action posts a GitHub review per lens on every
# run, and a lens with zero findings still posts one — it anchors a synthetic
# "See the review summary." inline comment on the first changed line (v3.0.0
# action.yml, the `if (!comments.length)` fallback). There is no input that
# suppresses posting, so six lenses times every push put review comments on
# every PR regardless of whether anything was found. Nothing gated on them:
# "Merge Gate" was never added to branch protection in this repo.
#
# Setup: repo secret OPENROUTER_API_KEY. Toggle lenses in the ENABLED list below
# (one source of truth for the matrix + gate). Action pinned to a SHA (v3.0.0).

name: Blind Peer Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Number of the open PR to review'
        required: true
        type: string

# Keyed on the PR, not github.ref: a dispatch always runs on a branch ref (main,
# normally), so keying on the ref would make two reviews of two different PRs
# cancel each other.
concurrency:
  group: blind-peer-review-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: node {0}
        env:
          ENABLED: |
            cold_read  # logic bugs, footguns (zero context)
            edge_case  # unhandled branches / boundaries
            acceptance # PR acceptance criteria met + tested
            security   # exploitable security vulnerabilities
            red_team   # red-team attack paths (auth/infra)
            policy     # AI-provenance policy + repo rules
        run: |
          const NAMES = {
            cold_read: "Cold Read", "edge_case": "Edge Cases",
            acceptance: "Acceptance Criteria", security: "Security Review", red_team: "Red Team",
            policy: "Policy & Provenance",
          };
          const keys = (process.env.ENABLED || "").split("\n")
            .map((l) => l.replace(/#.*/, "").trim()).filter(Boolean);
          if (keys.length === 0) {
            core.setFailed("ENABLED must list at least one lens; an empty matrix would fail workflow validation with an opaque error.");
            return;
          }
          const include = keys.map((k) => ({ lens: k, name: NAMES[k] || k }));
          const fs = require("fs");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);

  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No fork/bot guard is needed any more: workflow_dispatch requires write
    # access on this repo, so a fork or a bot cannot start this workflow at all.
    # The old guard read github.event.pull_request.*, which is empty on a
    # dispatch — it would evaluate false and skip every lens.
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Wait for deterministic checks
        uses: jamescrowley321/blind-peer-review@9cf7e5a77cb7372122571feb9741049d7b5f94dc # v3.0.0
        with:
          mode: preflight
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ inputs.pr_number }}
          # Only the *fast* deterministic checks gate the review — their job is
          # to avoid spending review compute on a PR that fails basic CI. The
          # mutation gate (ci / security-gate) is deliberately excluded: on PRs
          # that touch security-critical code it runs 40+ minutes, far past the
          # action's 600s preflight timeout, so waiting on it here made the
          # preflight time out and skip every lens (Merge Gate then failed
          # closed). It stays enforced independently via the required
          # ci / ci-complete check, which aggregates security-gate.
          #
          # One check name per line — v3.0.0 stopped splitting this input on
          # commas (a check name may legally contain one). The old comma form
          # parsed as a SINGLE check literally named "ci / lint, ci / unit-tests",
          # which never reports, so preflight could only end in its 600s timeout
          # and the Merge Gate then failed closed on every PR.
          #
          # The prefix is the CALLING job's name, not the workflow's. ci.yml is
          # a reusable workflow invoked as job id `ci` by both build.yml and
          # publish-prerelease.yml, so on a pull request the checks report as
          # `ci / lint` and `ci / unit-tests` (twice each — harmless, the action
          # takes the latest by started_at). "Full CI (all integrations)" is
          # nightly.yml's job name; it is schedule/dispatch-only and never runs
          # on a PR, so naming it here would wait out the timeout just as surely
          # as the comma did.
          required_checks: |
            ci / lint
            ci / unit-tests

  review:
    name: ${{ matrix.name }}
    needs: [config, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - name: ${{ matrix.name }}
        uses: jamescrowley321/blind-peer-review@9cf7e5a77cb7372122571feb9741049d7b5f94dc # v3.0.0
        with:
          mode: lens
          lens: ${{ matrix.lens }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ inputs.pr_number }}
          api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # google/gemini-2.5-pro: stable OpenRouter slug that pi's catalog also
          # carries, with strong JSON adherence. Anthropic Sonnet-5 is unusable
          # via openrouter+pi right now — OpenRouter retired the undated alias
          # (404) while pi's catalog lacks the dated snapshot. This matches the
          # action's v3.0.0 default; kept explicit here for clarity. No
          # models_config: the account/default routing is used (the proven-green
          # self-review config), avoiding a zdr-no-endpoint failure mode.
          model: google/gemini-2.5-pro

  gate:
    name: Merge Gate
    needs: [config, preflight, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Always run so the required "Merge Gate" check is never absent or skipped.
    # Branch protection treats a skipped required check as passing, so a gate
    # that skips (as it did for fork/bot PRs when review was skipped) would let
    # an untrusted PR merge with zero adversarial review. Fail closed instead.
    if: always()
    # Read-only by design: gate mode reads the lens reviews and reports its
    # verdict through this job's own success/failure status (the required
    # "Merge Gate" check). It performs no Octokit writes, so it needs no
    # checks:write / pull-requests:write — keep it least-privilege.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Fail closed whenever the review did not complete cleanly. Two cases:
      #   - skipped: fork/bot PRs (out of the trust boundary — preflight skips
      #     them, which skips the lenses).
      #   - failure/cancelled: one or more lens legs crashed (model 5xx, network,
      #     action bug), leaving an incomplete review.
      # In both cases the required check must be an explicit failure, never
      # absent/skipped (branch protection treats a skipped required check as
      # passing) and never adjudicated on a partial lens set as if it were clean.
      - name: Fail closed when review did not complete
        if: needs.review.result != 'success'
        run: |
          echo "::error::Blind peer review did not complete cleanly (review=${{ needs.review.result }}): preflight failed, or one or more lenses crashed. Nothing was adjudicated — re-run the dispatch, or review locally with 'make review'."
          exit 1
      - name: Adjudicate lenses
        if: needs.review.result == 'success'
        uses: jamescrowley321/blind-peer-review@9cf7e5a77cb7372122571feb9741049d7b5f94dc # v3.0.0
        with:
          mode: gate
          lenses: ${{ needs.config.outputs.matrix }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ inputs.pr_number }}
