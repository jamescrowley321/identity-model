# Blind Peer Review: eight fresh-context AI lenses review each PR diff.
#
# Switched by the repo variable RUN_LENSES: the lens jobs call OpenRouter and
# cost money, so nothing runs unless it is 'true'.
#
#     gh variable set RUN_LENSES --body true   # on
#     gh variable delete RUN_LENSES            # off
#
# "Merge Gate" is advisory until it is added to the required status checks.

name: Blind Peer Review

on:
  pull_request:
    # `edited` re-runs the policy lens after a PR-description fix, which changes no SHA.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

concurrency:
  group: blind-peer-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: read

jobs:
  config:
    if: vars.RUN_LENSES == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        uses: jamescrowley321/blind-peer-review@439e22c6dcfdaefc6c1713d9f5b3d259ee38cf19 # v3.10.0
        with:
          mode: config
          github_token: ${{ secrets.GITHUB_TOKEN }}
          enabled: |
            cold_read
            edge_case
            acceptance
            security
            red_team
            policy
            owasp_web
            owasp_llm

  # No spend on fork PRs (no secret anyway) or Dependabot.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: >-
      vars.RUN_LENSES == 'true' &&
      github.event.pull_request.head.repo.fork == false &&
      github.actor != 'dependabot[bot]'
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Wait for deterministic checks
        uses: jamescrowley321/blind-peer-review@439e22c6dcfdaefc6c1713d9f5b3d259ee38cf19 # v3.10.0
        with:
          mode: preflight
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Exact check-run names, one per line.
          required_checks: |
            ci / lint

  review:
    name: ${{ matrix.name }}
    needs: [config, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - name: ${{ matrix.name }}
        uses: jamescrowley321/blind-peer-review@439e22c6dcfdaefc6c1713d9f5b3d259ee38cf19 # v3.10.0
        with:
          mode: lens
          lens: ${{ matrix.lens }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_key: ${{ secrets.OPENROUTER_API_KEY }}
          model: ${{ matrix.model }}
          # Zero-data-retention routing for the default model.
          models_config: |
            {
              "providers": {
                "openrouter": {
                  "modelOverrides": {
                    "google/gemini-3.8-flash": {
                      "compat": { "openRouterRouting": { "zdr": true, "data_collection": "deny" } }
                    }
                  }
                }
              }
            }

  gate:
    name: Merge Gate
    needs: [config, preflight, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && vars.RUN_LENSES == 'true'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Record exempt PR
        if: github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'
        run: echo "Blind peer review is intentionally exempt for fork and Dependabot PRs."
      - name: Fail closed when prerequisites did not succeed
        if: >-
          github.event.pull_request.head.repo.fork == false &&
          github.actor != 'dependabot[bot]' &&
          (needs.config.result != 'success' || needs.preflight.result != 'success' || needs.review.result != 'success')
        env:
          CONFIG_RESULT: ${{ needs.config.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          echo "::error::Blind peer review prerequisites did not succeed (config=$CONFIG_RESULT, preflight=$PREFLIGHT_RESULT, review=$REVIEW_RESULT)."
          exit 1
      - name: Adjudicate lenses
        if: >-
          github.event.pull_request.head.repo.fork == false &&
          github.actor != 'dependabot[bot]' &&
          needs.config.result == 'success' && needs.preflight.result == 'success' && needs.review.result == 'success'
        uses: jamescrowley321/blind-peer-review@439e22c6dcfdaefc6c1713d9f5b3d259ee38cf19 # v3.10.0
        with:
          mode: gate
          lenses: ${{ needs.config.outputs.matrix }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
