name: Conformance (Hosted)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish results on the public certification.openid.net list"
        type: choice
        default: none
        options:
          - none
          - summary
          - everything

jobs:
  conformance-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install httpx
          pip install uvicorn fastapi python-multipart
          pip install ./py

      - name: Start RP harness
        working-directory: conformance
        run: |
          uvicorn app:app --host 0.0.0.0 --port 8888 &
          echo "Waiting for RP harness..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8888/health > /dev/null 2>&1; then
              echo "RP harness is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timed out waiting for RP harness"
              exit 1
            fi
            sleep 2
          done

      - name: Run Basic RP conformance tests
        env:
          CONFORMANCE_SERVER: https://www.certification.openid.net/
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: |
          python conformance/run_tests.py \
            --plan basic-rp \
            --output conformance/results/hosted/basic-rp-latest.json \
            --export-zip conformance/results/hosted/basic-rp-export.zip \
            --rp-logs-zip conformance/results/hosted/basic-rp-rp-logs.zip \
            --publish "${{ inputs.publish }}" \
            --verbose

      - name: Run Config RP conformance tests
        env:
          CONFORMANCE_SERVER: https://www.certification.openid.net/
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: |
          python conformance/run_tests.py \
            --plan config-rp \
            --output conformance/results/hosted/config-rp-latest.json \
            --export-zip conformance/results/hosted/config-rp-export.zip \
            --rp-logs-zip conformance/results/hosted/config-rp-rp-logs.zip \
            --publish "${{ inputs.publish }}" \
            --verbose

      - name: Run Form Post Basic RP conformance tests
        env:
          CONFORMANCE_SERVER: https://www.certification.openid.net/
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: |
          python conformance/run_tests.py \
            --plan form-post-basic-rp \
            --output conformance/results/hosted/form-post-basic-rp-latest.json \
            --export-zip conformance/results/hosted/form-post-basic-rp-export.zip \
            --rp-logs-zip conformance/results/hosted/form-post-basic-rp-rp-logs.zip \
            --publish "${{ inputs.publish }}" \
            --verbose

      # ── Extended certification profiles (Story 23.1 / #607) ──
      # Hosted evidence runs for the FAPI 2.0, Dynamic Registration and Logout
      # RP plans, mirroring the basic-rp step. Each produces an --export-zip
      # (certification submission bundle) + --rp-logs-zip. run_tests.py fails
      # loud if CONFORMANCE_TOKEN is absent, so a missing secret never yields a
      # silent pass. mTLS (fapi2-mtls-rp) is intentionally omitted here — it
      # needs a mutual-TLS terminator not present in this hosted-RP path.
      #
      # This is a manual (workflow_dispatch) evidence-collection workflow, NOT a
      # release gate — its job is to produce the full bundle set in a single run.
      # The three plans that are report-only in conformance.yml (fapi2-rp,
      # fapi2-message-signing-rp, backchannel-logout-rp) carry a known-red leg
      # (see docs/security/harder-tier-coverage.md / DEC-001), so they are marked
      # continue-on-error here too — otherwise a red plan would abort the job and
      # the later dynamic/logout evidence bundles would never be produced.
      - name: Run FAPI 2.0 Security Profile RP conformance tests (report-only)
        continue-on-error: true
        env:
          CONFORMANCE_SERVER: https://www.certification.openid.net/
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: |
          echo "::warning::fapi2-rp hosted evidence is report-only — known red: invalid-alternate-alg INTERRUPTED (task fix:conformance-fapi2-invalid-alt-alg)"
          python conformance/run_tests.py \
            --plan fapi2-rp \
            --output conformance/results/hosted/fapi2-rp-latest.json \
            --export-zip conformance/results/hosted/fapi2-rp-export.zip \
            --rp-logs-zip conformance/results/hosted/fapi2-rp-rp-logs.zip \
            --publish "${{ inputs.publish }}" \
            --verbose

      - name: Run FAPI 2.0 Message Signing RP conformance tests (report-only)
        continue-on-error: true
        env:
          CONFORMANCE_SERVER: https://www.certification.openid.net/
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: |
          echo "::warning::fapi2-message-signing-rp hosted evidence is report-only — known red: invalid-alternate-alg INTERRUPTED (task fix:conformance-fapi2-invalid-alt-alg)"
          python conformance/run_tests.py \
            --plan fapi2-message-signing-rp \
            --output conformance/results/hosted/fapi2-message-signing-rp-latest.json \
            --export-zip conformance/results/hosted/fapi2-message-signing-rp-export.zip \
            --rp-logs-zip conformance/results/hosted/fapi2-message-signing-rp-rp-logs.zip \
            --publish "${{ inputs.publish }}" \
            --verbose

      - name: Run Dynamic Registration RP conformance tests
        env:
          CONFORMANCE_SERVER: https://www.certification.openid.net/
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: |
          python conformance/run_tests.py \
            --plan dynamic-rp \
            --output conformance/results/hosted/dynamic-rp-latest.json \
            --export-zip conformance/results/hosted/dynamic-rp-export.zip \
            --rp-logs-zip conformance/results/hosted/dynamic-rp-rp-logs.zip \
            --publish "${{ inputs.publish }}" \
            --verbose

      - name: Run RP-Initiated Logout RP conformance tests
        env:
          CONFORMANCE_SERVER: https://www.certification.openid.net/
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: |
          python conformance/run_tests.py \
            --plan rpinitiated-logout-rp \
            --output conformance/results/hosted/rpinitiated-logout-rp-latest.json \
            --export-zip conformance/results/hosted/rpinitiated-logout-rp-export.zip \
            --rp-logs-zip conformance/results/hosted/rpinitiated-logout-rp-rp-logs.zip \
            --publish "${{ inputs.publish }}" \
            --verbose

      - name: Run Back-Channel Logout RP conformance tests (report-only)
        continue-on-error: true
        env:
          CONFORMANCE_SERVER: https://www.certification.openid.net/
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: |
          echo "::warning::backchannel-logout-rp hosted evidence is report-only — known red: rpinitlogout-wrong-alg expects 400 (task fix:conformance-backchannel-wrong-alg)"
          python conformance/run_tests.py \
            --plan backchannel-logout-rp \
            --output conformance/results/hosted/backchannel-logout-rp-latest.json \
            --export-zip conformance/results/hosted/backchannel-logout-rp-export.zip \
            --rp-logs-zip conformance/results/hosted/backchannel-logout-rp-rp-logs.zip \
            --publish "${{ inputs.publish }}" \
            --verbose

      - name: Upload conformance results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: conformance-hosted-results
          path: |
            conformance/results/hosted/*-latest.json
            conformance/results/hosted/*-export.zip
            conformance/results/hosted/*-rp-logs.zip
          retention-days: 30
