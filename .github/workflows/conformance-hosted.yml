name: Conformance (Hosted)

permissions:
  contents: read

on:
  # Runs continuously against the hosted suite, not just on demand: every merge
  # to main plus a daily run, so drift in the library or the hosted suite shows
  # up the day it happens. PRs are left to conformance.yml (the self-hosted
  # suite), since fork PRs get no secrets.
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC, after conformance (06:00) and nightly (07:00)
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish results on the public certification.openid.net list"
        type: choice
        default: none
        options:
          - none
          - summary
          - everything

# One run at a time against the shared hosted account; never cancel a run
# mid-plan, which would leave it half-finished on the suite.
concurrency:
  group: conformance-hosted
  cancel-in-progress: false

jobs:
  conformance-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # A stale token makes the suite answer 302 -> login, which surfaces much
      # later as an opaque HTTP error. Fail up front with the actual cause.
      - name: Check CONFORMANCE_TOKEN
        env:
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: |
          if [ -z "$CONFORMANCE_TOKEN" ]; then
            echo "::error::CONFORMANCE_TOKEN secret is not set"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CONFORMANCE_TOKEN" \
            https://www.certification.openid.net/api/plan)
          if [ "$status" != "200" ]; then
            echo "::error::certification.openid.net rejected CONFORMANCE_TOKEN (HTTP $status); generate a new token and update the secret"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: |
          uv pip install --system -r conformance/requirements.txt
          uv pip install --system ./py

      - name: Start RP harness
        working-directory: conformance
        run: |
          uvicorn app:app --host 0.0.0.0 --port 8888 &
          echo "Waiting for RP harness..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8888/health > /dev/null 2>&1; then
              echo "RP harness is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timed out waiting for RP harness"
              exit 1
            fi
            sleep 2
          done

      - name: Run Basic RP conformance tests
        env:
          CONFORMANCE_SERVER: https://www.certification.openid.net/
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: |
          python conformance/run_tests.py \
            --plan basic-rp \
            --output conformance/results/hosted/basic-rp-latest.json \
            --export-zip conformance/results/hosted/basic-rp-export.zip \
            --rp-logs-zip conformance/results/hosted/basic-rp-rp-logs.zip \
            --publish "${{ inputs.publish || 'none' }}" \
            --verbose

      - name: Run Config RP conformance tests
        env:
          CONFORMANCE_SERVER: https://www.certification.openid.net/
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: |
          python conformance/run_tests.py \
            --plan config-rp \
            --output conformance/results/hosted/config-rp-latest.json \
            --export-zip conformance/results/hosted/config-rp-export.zip \
            --rp-logs-zip conformance/results/hosted/config-rp-rp-logs.zip \
            --publish "${{ inputs.publish || 'none' }}" \
            --verbose

      - name: Run Form Post Basic RP conformance tests
        env:
          CONFORMANCE_SERVER: https://www.certification.openid.net/
          CONFORMANCE_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: |
          python conformance/run_tests.py \
            --plan form-post-basic-rp \
            --output conformance/results/hosted/form-post-basic-rp-latest.json \
            --export-zip conformance/results/hosted/form-post-basic-rp-export.zip \
            --rp-logs-zip conformance/results/hosted/form-post-basic-rp-rp-logs.zip \
            --publish "${{ inputs.publish || 'none' }}" \
            --verbose

      - name: Upload conformance results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: conformance-hosted-results
          path: |
            conformance/results/hosted/*-latest.json
            conformance/results/hosted/*-export.zip
            conformance/results/hosted/*-rp-logs.zip
          retention-days: 30
