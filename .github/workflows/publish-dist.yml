name: Publish Distribution 📦

on:
  push:
    tags:
      # Python releases are tagged py-v{version} (CONS-2.2), keeping them
      # distinct from the go/vX.Y.Z and rust-vX.Y.Z tags.
      - "py-v[0-9]+.[0-9]+.[0-9]+"
      - "py-v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "py-v[0-9]+.[0-9]+.[0-9]+-[ab][0-9]+"

permissions:
  contents: read

jobs:
  publish-to-pypi:
    runs-on: ubuntu-latest
    # OIDC Trusted Publishing to PyPI (no stored API token). Requires a PyPI
    # Trusted Publisher registered for project `py-identity-model` pointing at
    # this repo + workflow `publish-dist.yml` + environment `pypi`.
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.12
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: make ci-setup
      - name: Set tag version
        id: vars
        # The pushed tag is py-v{version}; strip the py-v prefix to get the
        # PEP 440 version written into pyproject.toml for the build.
        run: echo "tag=${GITHUB_REF_NAME#py-v}" >> $GITHUB_OUTPUT
      - name: Build distribution 📦
        run: |
          echo ${{ steps.vars.outputs.tag }}
          # Anchor to the project.version line: an unanchored `s/0.0.0/<ver>/`
          # also matches the `0.0.0` inside dependency pins (e.g.
          # `cryptography>=50.0.0`), rewriting it to `cryptography>=5<ver>` and
          # breaking the build (this froze every cryptography>=50 release).
          sed -i -e "s/^version = \"0.0.0\"/version = \"${{ steps.vars.outputs.tag }}\"/" py/pyproject.toml
          make build-dist
      - name: Publish distribution 📦 to PyPI (trusted publishing)
        # OIDC — no token. `uv build` (via make build-dist) writes to py/dist,
        # so publish from there. `--trusted-publishing always` forces OIDC and
        # fails loudly if the Trusted Publisher is misconfigured, rather than
        # silently falling back to a token.
        run: cd py && uv publish --trusted-publishing always