name: Conformance

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  # Runs as a required pre-release gate too: release.yml calls this workflow
  # (workflow_call) and its release job `needs` it, so no tag/publish happens
  # unless conformance passes. That call also covers every push to main, so a
  # standalone push trigger here would just double-run the ~30-min suite.
  schedule:
    - cron: '0 6 * * *' # daily conformance run off main (06:00 UTC)
  workflow_dispatch:
  workflow_call:

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Start conformance suite
        working-directory: conformance
        run: docker compose up -d --build --wait
        timeout-minutes: 10

      - name: Wait for conformance suite
        run: |
          echo "Waiting for conformance suite at https://localhost.emobix.co.uk:8443..."
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost.emobix.co.uk:8443/ || true)
            if [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 400 ] 2>/dev/null; then
              echo "Conformance suite is ready (HTTP $HTTP_CODE)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for conformance suite"
              docker compose -f conformance/docker-compose.yml logs server
              exit 1
            fi
            sleep 5
          done

      - name: Wait for RP harness
        run: |
          echo "Waiting for RP harness at http://localhost:8888/health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8888/health > /dev/null 2>&1; then
              echo "RP harness is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timed out waiting for RP harness"
              docker compose -f conformance/docker-compose.yml logs rp
              exit 1
            fi
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install test runner dependencies
        run: uv pip install --system httpx cryptography

      - name: Run Basic RP conformance tests
        run: |
          python conformance/run_tests.py \
            --plan basic-rp \
            --output conformance/results/basic-rp-latest.json \
            --verbose

      - name: Run Config RP conformance tests
        # signing-key-rotation is a known pre-existing timeout — don't block other profiles
        continue-on-error: true
        run: |
          python conformance/run_tests.py \
            --plan config-rp \
            --output conformance/results/config-rp-latest.json \
            --verbose

      - name: Run Form Post Basic RP conformance tests
        run: |
          python conformance/run_tests.py \
            --plan form-post-basic-rp \
            --output conformance/results/form-post-basic-rp-latest.json \
            --verbose

      - name: Export HTML results and logs
        if: always()
        run: |
          mkdir -p conformance/results/logs

          # Export HTML results for each plan that produced results
          for RESULTS_FILE in conformance/results/*-latest.json; do
            [ -f "$RESULTS_FILE" ] || continue
            PLAN_NAME=$(basename "$RESULTS_FILE" -latest.json)
            PLAN_ID=$(python3 -c "
          import json, sys
          try:
              results = json.load(open(sys.argv[1]))
              plan_id = results.get('plan_id', '')
              if plan_id:
                  print(plan_id, end='')
              else:
                  sys.exit(1)
          except Exception:
              sys.exit(1)
          " "$RESULTS_FILE" 2>/dev/null) && \
            curl -sfk "https://localhost.emobix.co.uk:8443/api/plan/exporthtml/${PLAN_ID}" \
              -o "conformance/results/${PLAN_NAME}-report.zip" && \
            echo "HTML results exported for ${PLAN_NAME} plan ${PLAN_ID}" || \
            echo "Warning: could not export HTML results for ${PLAN_NAME} (suite may be down)"
          done

          # Download suite logs for debugging
          docker compose -f conformance/docker-compose.yml logs server > conformance/results/logs/server.log 2>&1 || true
          docker compose -f conformance/docker-compose.yml logs rp > conformance/results/logs/rp.log 2>&1 || true

      - name: Upload conformance results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: conformance-results
          path: |
            conformance/results/*-latest.json
            conformance/results/*-report.zip
            conformance/results/logs/
          retention-days: 30

      - name: Teardown
        if: always()
        working-directory: conformance
        run: docker compose down -v

  # fastapi-identity-model package regression: the same local suite plans,
  # driven against the real build_oidc_router via the rp-fastapi harness.
  # Regression stage only — no hosted suite, no certification export (#242).
  conformance-fastapi:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Start conformance suite
        working-directory: conformance
        run: docker compose up -d --build --wait
        timeout-minutes: 10

      - name: Wait for conformance suite
        run: |
          echo "Waiting for conformance suite at https://localhost.emobix.co.uk:8443..."
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost.emobix.co.uk:8443/ || true)
            if [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 400 ] 2>/dev/null; then
              echo "Conformance suite is ready (HTTP $HTTP_CODE)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for conformance suite"
              docker compose -f conformance/docker-compose.yml logs server
              exit 1
            fi
            sleep 5
          done

      - name: Wait for fastapi RP harness
        run: |
          echo "Waiting for fastapi RP harness at http://localhost:8889/health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8889/health > /dev/null 2>&1; then
              echo "fastapi RP harness is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timed out waiting for fastapi RP harness"
              docker compose -f conformance/docker-compose.yml logs rp-fastapi
              exit 1
            fi
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install test runner dependencies
        run: uv pip install --system httpx cryptography

      - name: Run Basic RP package regression
        run: |
          python conformance/run_tests.py \
            --plan fastapi-basic-rp \
            --rp-url http://localhost:8889 \
            --output conformance/results/fastapi-basic-rp-latest.json \
            --verbose

      - name: Run Config RP package regression
        # signing-key-rotation is a known pre-existing timeout — don't block other profiles
        continue-on-error: true
        run: |
          python conformance/run_tests.py \
            --plan fastapi-config-rp \
            --rp-url http://localhost:8889 \
            --output conformance/results/fastapi-config-rp-latest.json \
            --verbose

      - name: Run Form Post Basic RP package regression
        run: |
          python conformance/run_tests.py \
            --plan fastapi-form-post-basic-rp \
            --rp-url http://localhost:8889 \
            --output conformance/results/fastapi-form-post-basic-rp-latest.json \
            --verbose

      - name: Collect suite and harness logs
        if: always()
        run: |
          mkdir -p conformance/results/logs
          docker compose -f conformance/docker-compose.yml logs server > conformance/results/logs/server.log 2>&1 || true
          docker compose -f conformance/docker-compose.yml logs rp-fastapi > conformance/results/logs/rp-fastapi.log 2>&1 || true

      - name: Upload conformance results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: conformance-fastapi-results
          path: |
            conformance/results/fastapi-*-latest.json
            conformance/results/logs/
          retention-days: 30

      - name: Teardown
        if: always()
        working-directory: conformance
        run: docker compose down -v
