name: Conformance

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  # Runs as a required pre-release gate too: release.yml calls this workflow
  # (workflow_call) and its release job `needs` it, so no tag/publish happens
  # unless conformance passes. That call also covers every push to main, so a
  # standalone push trigger here would just double-run the ~30-min suite.
  schedule:
    - cron: '0 6 * * *' # daily conformance run off main (06:00 UTC)
  workflow_dispatch:
  workflow_call:

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Start conformance suite
        working-directory: conformance
        run: docker compose up -d --build --wait
        timeout-minutes: 10

      - name: Wait for conformance suite
        run: |
          echo "Waiting for conformance suite at https://localhost.emobix.co.uk:8443..."
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost.emobix.co.uk:8443/ || true)
            if [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 400 ] 2>/dev/null; then
              echo "Conformance suite is ready (HTTP $HTTP_CODE)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for conformance suite"
              docker compose -f conformance/docker-compose.yml logs server
              exit 1
            fi
            sleep 5
          done

      - name: Wait for RP harness
        run: |
          echo "Waiting for RP harness at http://localhost:8888/health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8888/health > /dev/null 2>&1; then
              echo "RP harness is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timed out waiting for RP harness"
              docker compose -f conformance/docker-compose.yml logs rp
              exit 1
            fi
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install test runner dependencies
        run: pip install httpx cryptography

      - name: Run Basic RP conformance tests
        run: |
          python conformance/run_tests.py \
            --plan basic-rp \
            --output conformance/results/basic-rp-latest.json \
            --verbose

      - name: Run Config RP conformance tests
        # signing-key-rotation is a known pre-existing timeout — don't block other profiles
        continue-on-error: true
        run: |
          python conformance/run_tests.py \
            --plan config-rp \
            --output conformance/results/config-rp-latest.json \
            --verbose

      - name: Run Form Post Basic RP conformance tests
        run: |
          python conformance/run_tests.py \
            --plan form-post-basic-rp \
            --output conformance/results/form-post-basic-rp-latest.json \
            --verbose

      # ── Extended certification profiles (Story 23.1 / #607) ──
      # FAPI 2.0 + Dynamic Registration + Logout RP plans. These run nightly
      # and on release (this job is workflow_call-gated by release.yml, so a
      # non-continue-on-error step here blocks the release tag). Per DEC-001 a
      # profile is only promoted to a hard release gate once it proves green
      # against the local suite in the test phase; otherwise it stays
      # report-only (continue-on-error) with a loud ::warning:: naming the red
      # leg + its follow-up task, never silent-pass.
      # Status after the 2026-09-03 local OIDF run (authoritative record:
      # docs/security/harder-tier-coverage.md / DEC-001):
      #   dynamic-rp .............. GREEN  -> hard gate
      #   rpinitiated-logout-rp ... GREEN  -> hard gate
      #   fapi2-rp ................ 21/22  -> report-only (invalid-alternate-alg INTERRUPTED)
      #   fapi2-message-signing ... 27/28  -> report-only (invalid-alternate-alg INTERRUPTED)
      #   backchannel-logout-rp ... 7/8    -> report-only (wrong-alg expects 400)
      # The three report-only plans each carry a single known-red negative leg
      # (RP-harness alg-rejection flow, tracked as fix:conformance-fapi2-invalid-alt-alg
      # and fix:conformance-backchannel-wrong-alg). continue-on-error keeps them
      # from gating a release tag until the harness path is fixed and the plan
      # proves green — never gate a release on a red leg, never silent-pass.
      # Evidence for each profile is picked up by the existing *-latest.json
      # export + upload steps below.
      - name: Run FAPI 2.0 Security Profile RP conformance tests (report-only)
        continue-on-error: true
        run: |
          echo "::warning::fapi2-rp is report-only — known red: invalid-alternate-alg INTERRUPTED (task fix:conformance-fapi2-invalid-alt-alg)"
          python conformance/run_tests.py \
            --plan fapi2-rp \
            --output conformance/results/fapi2-rp-latest.json \
            --verbose

      - name: Run FAPI 2.0 Message Signing RP conformance tests (report-only)
        continue-on-error: true
        run: |
          echo "::warning::fapi2-message-signing-rp is report-only — known red: invalid-alternate-alg INTERRUPTED (task fix:conformance-fapi2-invalid-alt-alg)"
          python conformance/run_tests.py \
            --plan fapi2-message-signing-rp \
            --output conformance/results/fapi2-message-signing-rp-latest.json \
            --verbose

      # Release gate: dynamic-rp proved green locally 2026-09-03 (10 passed,
      # 0 failed, 2 skipped) — no continue-on-error, so a regression here blocks
      # the release tag (this job is workflow_call-gated by release.yml).
      - name: Run Dynamic Registration RP conformance tests
        run: |
          python conformance/run_tests.py \
            --plan dynamic-rp \
            --output conformance/results/dynamic-rp-latest.json \
            --verbose

      # Release gate: rpinitiated-logout-rp proved green locally 2026-09-03
      # (2 passed, 0 failed, 1 skipped) — hard gate, no continue-on-error.
      - name: Run RP-Initiated Logout RP conformance tests
        run: |
          python conformance/run_tests.py \
            --plan rpinitiated-logout-rp \
            --output conformance/results/rpinitiated-logout-rp-latest.json \
            --verbose

      # report-only (DEC-001): local OIDF run 2026-09-03 left one known-red leg —
      # oidcc-client-test-rp-backchannel-rpinitlogout-wrong-alg FAILED
      # (EnsureBackChannelLogoutUriResponseStatusCodeIs400: harness returned a
      # non-400 response for a wrong-alg back-channel logout token; 7/8). Tracked
      # in fix:conformance-backchannel-wrong-alg; keep continue-on-error until the
      # harness backchannel_logout_uri handler rejects bad-alg tokens with 400.
      - name: Run Back-Channel Logout RP conformance tests (report-only)
        continue-on-error: true
        run: |
          echo "::warning::backchannel-logout-rp is report-only — known red: rpinitlogout-wrong-alg expects 400 (task fix:conformance-backchannel-wrong-alg)"
          python conformance/run_tests.py \
            --plan backchannel-logout-rp \
            --output conformance/results/backchannel-logout-rp-latest.json \
            --verbose

      - name: Skip FAPI 2.0 mTLS RP conformance tests (explicit)
        # Explicit loud skip, never a silent pass: the FAPI2 mTLS variant needs
        # an mTLS terminator + provisioned client certs (RFC 8705) that are not
        # wired into the local suite path. Tracked for a future hosted run.
        run: |
          echo "SKIP: fapi2-mtls-rp not run — mTLS terminator + client certs are not"
          echo "      provisioned for the local conformance suite (RFC 8705)."
          echo "      This is an explicit skip, not a pass. See conformance/README.md."

      - name: Export HTML results and logs
        if: always()
        run: |
          mkdir -p conformance/results/logs

          # Export HTML results for each plan that produced results
          for RESULTS_FILE in conformance/results/*-latest.json; do
            [ -f "$RESULTS_FILE" ] || continue
            PLAN_NAME=$(basename "$RESULTS_FILE" -latest.json)
            PLAN_ID=$(python3 -c "
          import json, sys
          try:
              results = json.load(open(sys.argv[1]))
              plan_id = results.get('plan_id', '')
              if plan_id:
                  print(plan_id, end='')
              else:
                  sys.exit(1)
          except Exception:
              sys.exit(1)
          " "$RESULTS_FILE" 2>/dev/null) && \
            curl -sfk "https://localhost.emobix.co.uk:8443/api/plan/exporthtml/${PLAN_ID}" \
              -o "conformance/results/${PLAN_NAME}-report.zip" && \
            echo "HTML results exported for ${PLAN_NAME} plan ${PLAN_ID}" || \
            echo "Warning: could not export HTML results for ${PLAN_NAME} (suite may be down)"
          done

          # Download suite logs for debugging
          docker compose -f conformance/docker-compose.yml logs server > conformance/results/logs/server.log 2>&1 || true
          docker compose -f conformance/docker-compose.yml logs rp > conformance/results/logs/rp.log 2>&1 || true

      - name: Upload conformance results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: conformance-results
          path: |
            conformance/results/*-latest.json
            conformance/results/*-report.zip
            conformance/results/logs/
          retention-days: 30

      - name: Teardown
        if: always()
        working-directory: conformance
        run: docker compose down -v

  # fastapi-identity-model package regression: the same local suite plans,
  # driven against the real build_oidc_router via the rp-fastapi harness.
  # Regression stage only — no hosted suite, no certification export (#242).
  conformance-fastapi:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Start conformance suite
        working-directory: conformance
        run: docker compose up -d --build --wait
        timeout-minutes: 10

      - name: Wait for conformance suite
        run: |
          echo "Waiting for conformance suite at https://localhost.emobix.co.uk:8443..."
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost.emobix.co.uk:8443/ || true)
            if [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 400 ] 2>/dev/null; then
              echo "Conformance suite is ready (HTTP $HTTP_CODE)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for conformance suite"
              docker compose -f conformance/docker-compose.yml logs server
              exit 1
            fi
            sleep 5
          done

      - name: Wait for fastapi RP harness
        run: |
          echo "Waiting for fastapi RP harness at http://localhost:8889/health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8889/health > /dev/null 2>&1; then
              echo "fastapi RP harness is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timed out waiting for fastapi RP harness"
              docker compose -f conformance/docker-compose.yml logs rp-fastapi
              exit 1
            fi
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install test runner dependencies
        run: pip install httpx cryptography

      - name: Run Basic RP package regression
        run: |
          python conformance/run_tests.py \
            --plan fastapi-basic-rp \
            --rp-url http://localhost:8889 \
            --output conformance/results/fastapi-basic-rp-latest.json \
            --verbose

      - name: Run Config RP package regression
        # signing-key-rotation is a known pre-existing timeout — don't block other profiles
        continue-on-error: true
        run: |
          python conformance/run_tests.py \
            --plan fastapi-config-rp \
            --rp-url http://localhost:8889 \
            --output conformance/results/fastapi-config-rp-latest.json \
            --verbose

      - name: Run Form Post Basic RP package regression
        run: |
          python conformance/run_tests.py \
            --plan fastapi-form-post-basic-rp \
            --rp-url http://localhost:8889 \
            --output conformance/results/fastapi-form-post-basic-rp-latest.json \
            --verbose

      - name: Collect suite and harness logs
        if: always()
        run: |
          mkdir -p conformance/results/logs
          docker compose -f conformance/docker-compose.yml logs server > conformance/results/logs/server.log 2>&1 || true
          docker compose -f conformance/docker-compose.yml logs rp-fastapi > conformance/results/logs/rp-fastapi.log 2>&1 || true

      - name: Upload conformance results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: conformance-fastapi-results
          path: |
            conformance/results/fastapi-*-latest.json
            conformance/results/logs/
          retention-days: 30

      - name: Teardown
        if: always()
        working-directory: conformance
        run: docker compose down -v
