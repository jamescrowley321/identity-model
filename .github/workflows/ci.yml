name: CI

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      run-descope-integration:
        description: 'Run Descope integration tests'
        required: false
        type: boolean
        default: false
      run-example-tests:
        description: 'Run example integration tests'
        required: false
        type: boolean
        default: false
      run-build:
        description: 'Run build step'
        required: false
        type: boolean
        default: false
      run-ory-integration:
        description: 'Run Ory integration tests (skip in duplicate-call workflows to avoid upstream rate limits)'
        required: false
        type: boolean
        default: true
      run-native-tests:
        description: 'Force the Go + Rust suites regardless of change-detection (the nightly sets this so scheduled drift-detection is never skipped)'
        required: false
        type: boolean
        default: false

jobs:
  # Change-detection: the Go and Rust suites only need to run when their own
  # code — or the shared spec/infra they test against — changed (CONS-2.4).
  # The Python suites are NOT gated: it is the OIDF-certified library and its
  # tests always run. ci-complete treats a skipped job as a pass, so gating is
  # safe for the required merge gate.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - 'go/**'
            rust:
              - 'rust/**'
            shared:
              - 'spec/**'
              - 'infra/**'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Lint
        run: make lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Unit Tests
        run: make test-unit

  fastapi-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: fastapi-identity-model typecheck + tests
        run: make test-fastapi

  integration-tests-ory:
    if: inputs.run-ory-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Integration Tests (ORY)
        run: make test-integration-ory
        env:
          TEST_DISCO_ADDRESS: ${{ secrets.TEST_DISCO_ADDRESS }}
          TEST_JWKS_ADDRESS: ${{ secrets.TEST_JWKS_ADDRESS }}
          TEST_CLIENT_ID: ${{ secrets.TEST_CLIENT_ID }}
          TEST_CLIENT_SECRET: ${{ secrets.TEST_CLIENT_SECRET }}
          TEST_SCOPE: ${{ secrets.TEST_SCOPE }}
          TEST_EXPIRED_TOKEN: ${{ secrets.TEST_EXPIRED_TOKEN }}
          TEST_AUDIENCE: ${{ secrets.TEST_AUDIENCE }}

  integration-tests-descope:
    if: inputs.run-descope-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Integration Tests (Descope)
        run: make test-integration-descope
        env:
          TEST_DISCO_ADDRESS: ${{ secrets.DESCOPE_DISCO_ADDRESS }}
          TEST_JWKS_ADDRESS: ${{ secrets.DESCOPE_JWKS_ADDRESS }}
          TEST_CLIENT_ID: ${{ secrets.DESCOPE_CLIENT_ID }}
          TEST_CLIENT_SECRET: ${{ secrets.DESCOPE_CLIENT_SECRET }}
          TEST_SCOPE: ${{ secrets.DESCOPE_SCOPE }}
          TEST_EXPIRED_TOKEN: ${{ secrets.DESCOPE_EXPIRED_TOKEN }}
          TEST_AUDIENCE: ${{ secrets.DESCOPE_AUDIENCE }}

      - name: Upload token characterization (Descope)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: token-characterization-descope
          path: py/token_characterization_*.md
          if-no-files-found: ignore

  integration-tests-node-oidc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Start node-oidc-provider fixture
        run: docker compose -f infra/docker-compose.yml up -d --build --wait node-oidc-provider

      - name: Integration Tests (node-oidc-provider)
        run: uv run --directory py pytest src/tests -m integration --env-file=../.env.node-oidc -v

      - name: Tear down node-oidc-provider fixture
        if: always()
        run: docker compose -f infra/docker-compose.yml down

  integration-tests-keycloak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Start Keycloak fixture
        run: docker compose -f infra/docker-compose.yml up -d --build --wait keycloak

      - name: Integration Tests (Keycloak)
        run: uv run --directory py pytest src/tests -m integration --env-file=../.env.keycloak -v

      - name: Upload token characterization (Keycloak)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: token-characterization-keycloak
          path: py/token_characterization_*.md
          if-no-files-found: ignore

      - name: Tear down Keycloak fixture
        if: always()
        run: docker compose -f infra/docker-compose.yml down

  integration-tests-cross-issuer:
    # Both Docker IdPs up side by side so a REAL token minted by one is rejected
    # by an RS trusting the other (true cross-issuer, not a forged mock). The
    # single-provider jobs above can't do this — they run one IdP each.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Start node-oidc-provider + Keycloak fixtures
        run: docker compose -f infra/docker-compose.yml up -d --build --wait node-oidc-provider keycloak

      - name: Cross-issuer real-token rejection (node-oidc <-> Keycloak)
        run: uv run --directory py --all-packages pytest src/tests/integration/test_cross_issuer_real_idps.py -m integration -v

      - name: Tear down fixtures
        if: always()
        run: docker compose -f infra/docker-compose.yml down

  integration-tests-ws:
    # WebSocket auth (#598) + exact-match exclusion (#600) end-to-end proof:
    # test_ws_correctness.py boots the RS under real uvicorn and drives the
    # forged corpus through a real websockets handshake. It is self-contained
    # (mock OP over localhost HTTP, no Docker fixture), but it needs the `server`
    # extra (uvicorn + websockets), which the plain `-m integration` runs above
    # do NOT install — so it runs under `--all-packages` via its own target.
    # Without this job the test importorskips and a WS route silently losing its
    # guard would pass CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('py/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: make ci-setup

      - name: WebSocket + exact-exclusion correctness matrix (real handshake)
        run: make test-harness-ws

  example-tests:
    if: inputs.run-example-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Example Integration Tests
        run: make test-examples

  build:
    if: inputs.run-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Build
        run: make build-dist

  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Full history + the base branch tip so the mutation gate can diff
          # the changed security surface against BASE (Epic 19 G.1).
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Fetch base branch for diff
        # On a pull_request the reusable workflow inherits github.base_ref;
        # on a branch push it is empty, so fall back to main. Interpolate the
        # ref into an env var (not directly into the run: script) for hygiene.
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Security gate (mutation)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: BASE="origin/$BASE_REF" make security-gate

  load-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Load smoke (CI-short profile — real Locust vs the booted RS)
        env:
          HARNESS_SMOKE_REPORT: load-smoke-report.txt
        run: make test-harness-load

      # Per-scenario RPS/latency/gate table. Written before the gate assertions
      # run, so the artifact survives a failing gate — upload always.
      - name: Upload load-smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: load-smoke-report
          path: py/load-smoke-report.txt

  integration-tests-go:
    # Go suite vs the shared infra/ fixtures: node-oidc default profile, then
    # the same tests re-run against the IdentityServer profile (CONS-1.4).
    # TEST_REQUIRE_LIVE=1 turns provider-unreachable skips into failures so a
    # URL/profile drift cannot green-skip the whole leg; -v keeps remaining
    # skips visible in the log.
    # Runs only when go/ or the shared spec/infra changed (CONS-2.4).
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.shared == 'true' || inputs.run-native-tests }}
    runs-on: ubuntu-latest
    env:
      TEST_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Start node-oidc-provider + IdentityServer fixtures
        run: docker compose -f infra/docker-compose.yml up -d --build --wait node-oidc-provider identityserver

      - name: Go integration tests (node-oidc default profile)
        working-directory: go
        run: go test -v -tags=integration -count=1 ./...

      - name: Go integration tests (IdentityServer profile)
        run: |
          set -a && . ./.env.identityserver && set +a
          cd go && go test -v -tags=integration -count=1 ./...

      - name: Tear down fixtures
        if: always()
        run: docker compose -f infra/docker-compose.yml down

  go-checks:
    # Static analysis + race-enabled unit tests for the Go library, mirroring the
    # Python lint + unit-tests gate. golangci-lint runs the committed
    # go/.golangci.yml (gosec + the v2 default set) which nothing in CI invoked
    # before — the config existed but was never enforced. Unit tests run with the
    # race detector and emit a coverage profile (uploaded as an artifact; no hard
    # threshold — the integration suite exercises the live paths). Change-gated
    # like the other native jobs (CONS-2.4).
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.shared == 'true' || inputs.run-native-tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        run: go build ./...

      - name: go vet
        working-directory: go
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: go

      - name: Unit tests (race + coverage)
        working-directory: go
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-coverage
          path: go/coverage.out
          if-no-files-found: ignore

  go-vulncheck:
    # Reachability-aware vuln scan (govulncheck): flags advisories only on code
    # paths actually reached, complementing the lockfile-level OSV scan. Runs on
    # the latest stable Go (go-version-input: stable + check-latest) so a stdlib
    # advisory already fixed upstream (e.g. GO-2026-5026, fixed in go1.26.6) is
    # resolved by upgrading the toolchain, never by allowlisting a CVE. Change-
    # gated like the other native jobs (CONS-2.4).
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.shared == 'true' || inputs.run-native-tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          work-dir: go
          repo-checkout: false

  go-mutation-gate:
    # Diff-scoped mutation gate for the Go security surface (#638), mirroring
    # the Python security-gate contract: every mutant on a changed line inside
    # tools/mutation_security_native.py's GO_SURFACE must be killed by tests or
    # waived as a content-hashed equivalent (tools/mutation_security_go_allowlist.txt).
    # Fail-closed: only KILLED / NOT VIABLE pass; NOT COVERED, LIVED, TIMED OUT,
    # SKIPPED and any future status survive. gremlins scopes execution to the
    # changed lines itself (--diff), so out-of-scope PRs pass in seconds.
    # Change-gated like the other native jobs (CONS-2.4).
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.shared == 'true' || inputs.run-native-tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Full history + the base branch tip so the gate can diff the changed
          # security surface against BASE (same pattern as security-gate).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install gremlins
        # Pinned tag, integrity-checked by the Go module sumdb on install.
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Fetch base branch for diff
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Go mutation gate (diff-scoped)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: BASE="origin/$BASE_REF" make mutation-security-go

  rust-mutation-gate:
    # Diff-scoped mutation gate for the Rust security surface (#638), mirroring
    # the Python security-gate contract: every mutant on a changed line inside
    # tools/mutation_security_native.py's RUST_SURFACE must be killed by tests
    # or waived as a content-hashed equivalent (tools/mutation_security_rust_allowlist.txt).
    # Fail-closed: only CaughtMutant / Unviable pass; MissedMutant, Timeout and
    # any future summary survive, and any changed-line mutant cargo-mutants
    # skips fails the run outright. Out-of-scope PRs pass without a cargo build.
    # Change-gated like the other native jobs (CONS-2.4).
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.shared == 'true' || inputs.run-native-tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install cargo-mutants
        # Prebuilt release binary, pinned by version + SHA-256 (compiling it
        # from source would cost several minutes per run).
        run: |
          curl -sSL -o /tmp/cargo-mutants.tar.gz https://github.com/sourcefrog/cargo-mutants/releases/download/v27.1.0/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz
          echo "dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e  /tmp/cargo-mutants.tar.gz" | sha256sum --check
          tar -xzf /tmp/cargo-mutants.tar.gz -C "$HOME/.cargo/bin" cargo-mutants

      - name: Fetch base branch for diff
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Rust mutation gate (diff-scoped)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: BASE="origin/$BASE_REF" make mutation-security-rust

  spec-vector-coverage:
    # CONS-1.5 cross-language coverage gate: every language's thin runner must
    # execute every executable vector id in spec/vectors (offline — no
    # docker fixtures), and native cases must carry per-language test anchors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Spec vector-coverage gate
        run: make spec-coverage

  publish-parity:
    # CONS-2.5 publishing-parity gate: a wheel freshly built from py/ must still
    # ship everything the latest PyPI release did. Directional — it fails only on
    # regressions (a dropped module, a removed dependency, a changed package
    # name or wheel platform tag, a removed entry point), while legitimate
    # additions/constraint changes pass as notes so normal evolution isn't
    # blocked. Guards the CONS-2.1 relocation + CONS-2.2 release re-point against
    # silently shipping a smaller/different package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Publishing-parity gate
        run: make publish-parity

  integration-tests-rust:
    # Rust unit suite + #[ignore]-gated live suite vs the shared infra/
    # node-oidc fixture (CONS-1.4). TEST_REQUIRE_LIVE=1 turns silent skip-returns
    # in the live leg into panics so an unsourced profile or dead provider
    # cannot green-skip. Runs only when rust/ or the shared spec/infra changed
    # (CONS-2.4).
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.shared == 'true' || inputs.run-native-tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Rust unit tests
        working-directory: rust
        run: cargo test

      - name: Start node-oidc-provider fixture
        run: docker compose -f infra/docker-compose.yml up -d --build --wait node-oidc-provider

      - name: Rust live integration tests
        env:
          TEST_REQUIRE_LIVE: "1"
        run: |
          set -a && . ./.env.node-oidc && set +a
          cd rust && cargo test -- --ignored

      - name: Tear down fixture
        if: always()
        run: docker compose -f infra/docker-compose.yml down

  rust-checks:
    # Formatting + clippy (warnings-as-errors) + cargo-deny (advisories, licenses,
    # bans, sources — via the committed rust/deny.toml) for the Rust library,
    # mirroring the Python lint gate. cargo test already runs in
    # integration-tests-rust; this adds the static-analysis + supply-chain leg.
    # deny.toml existed but nothing in CI invoked it. Change-gated like the other
    # native jobs (CONS-2.4).
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.shared == 'true' || inputs.run-native-tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: rustfmt (check)
        working-directory: rust
        run: cargo fmt --all --check

      - name: clippy (warnings as errors)
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: rust/Cargo.toml

  ci-complete:
    if: always()
    needs: [changes, lint, unit-tests, fastapi-tests, integration-tests-ory, integration-tests-descope, integration-tests-node-oidc, integration-tests-keycloak, integration-tests-cross-issuer, integration-tests-ws, integration-tests-go, go-checks, go-vulncheck, go-mutation-gate, integration-tests-rust, rust-checks, rust-mutation-gate, spec-vector-coverage, publish-parity, example-tests, build, security-gate, load-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        run: |
          results=( \
            "${{ needs.changes.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.unit-tests.result }}" \
            "${{ needs.fastapi-tests.result }}" \
            "${{ needs.integration-tests-ory.result }}" \
            "${{ needs.integration-tests-descope.result }}" \
            "${{ needs.integration-tests-node-oidc.result }}" \
            "${{ needs.integration-tests-keycloak.result }}" \
            "${{ needs.integration-tests-cross-issuer.result }}" \
            "${{ needs.integration-tests-ws.result }}" \
            "${{ needs.integration-tests-go.result }}" \
            "${{ needs.go-checks.result }}" \
            "${{ needs.go-vulncheck.result }}" \
            "${{ needs.go-mutation-gate.result }}" \
            "${{ needs.integration-tests-rust.result }}" \
            "${{ needs.rust-checks.result }}" \
            "${{ needs.rust-mutation-gate.result }}" \
            "${{ needs.spec-vector-coverage.result }}" \
            "${{ needs.publish-parity.result }}" \
            "${{ needs.example-tests.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.security-gate.result }}" \
            "${{ needs.load-smoke.result }}" \
          )
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "CI failed: found job with result '$result'"
              exit 1
            fi
          done
          echo "All CI jobs passed"
