version: "2"

linters:
  # gosec: Go security linter (weak crypto, hardcoded creds, unsafe file perms,
  # TLS misconfig, etc.) — high value for an auth/JWT library. Added on top of
  # the golangci v2 default set (errcheck, govet, ineffassign, staticcheck, unused).
  enable:
    - gosec
    - forbidigo
  settings:
    forbidigo:
      # The library reads no environment (spec/config.md): every setting comes
      # from the caller's options. Tests, examples and the internal test
      # harnesses read provider profiles from the environment and are excluded
      # below. Two forbidden calls on one line are reported once.
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ|ExpandEnv)$
          msg: "the library reads no environment; take the value as an option"
    staticcheck:
      # QF* are gopls quickfix suggestions (style refactorings), not
      # correctness checks; staticcheck itself ships them disabled.
      checks:
        - all
        - "-QF*"
  exclusions:
    presets:
      # Restores the v1 default exclusions, e.g. errcheck on deferred
      # resp.Body.Close(), which is idiomatic Go.
      - std-error-handling
    rules:
      # Shipped library code (pkg/ and the internal packages it imports) is
      # barred from reading the environment; tests, examples and the internal
      # test harnesses may.
      - path: (_test\.go$|internal/(integrationtest|conformance)/|examples/)
        linters:
          - forbidigo
      # gosec on tests and internal test-support harnesses (integration runner,
      # conformance vector loader): reading fixture/vector files by a variable
      # path (G304), writing to test HTTP-server responses (G705), and test
      # credential literals (G101) are intentional in test scaffolding, not risks.
      # Shipped library code under pkg/ stays fully scanned.
      - path: (_test\.go$|internal/(integrationtest|conformance)/)
        linters:
          - gosec
      # token.go defines RFC 8693 grant-type / token-type URIs (e.g.
      # urn:ietf:params:oauth:grant-type:token-exchange). gosec G101 reads these
      # constant protocol identifiers as "hardcoded credentials"; they are not.
      - path: pkg/token/token.go
        text: "G101"
        linters:
          - gosec
