# python-semantic-release config for the Rust crate `rs-identity-model`.
#
# Invoked from the REPO ROOT (not py/, unlike the core and fastapi configs) so
# the sibling `rust/` and `py/tools/` paths below resolve directly:
#   uvx --from python-semantic-release==10.6.1 --with "gitpython<3.1.60" \
#     semantic-release -c py/tools/semantic-release-rust.toml version
# (the `release-rust-version` job in release.yml, after the core + fastapi + go
# version jobs, so the release pipelines never push to main concurrently).
#
# Only commits scoped "(rust)" drive this version (scope routing:
# py/tools/release_parsers.py:RustCommitParser); every other commit belongs to
# another release track. The bump is written into rust/Cargo.toml; the pushed
# `rust-v{version}` tag then triggers .github/workflows/release-rust.yml, which
# publishes the crate to crates.io via CARGO_REGISTRY_TOKEN.
[tool.semantic_release]
commit_parser = "py/tools/release_parsers.py:RustCommitParser"
tag_format = "rust-v{version}"
# 0.x crate: a breaking change bumps the minor, not to 1.0.0 — the 1.0.0 jump
# stays a deliberate, manual decision (mirrors the fastapi package).
major_on_zero = false
allow_zero_version = true
version_toml = ["rust/Cargo.toml:package.version"]
commit_message = "chore(rust): release {version}\n\nAutomatically generated by python-semantic-release"

# Release only from main — no prerelease branch group, so a dispatch from any
# other branch refuses to version rather than minting an rc.
[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog.default_templates]
changelog_file = "rust/CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
name = "origin"
type = "github"
