# python-semantic-release config for the Go library (identity-model/go).
#
# Invoked from the REPO ROOT so the sibling `go/` and `py/tools/` paths below
# resolve directly:
#   uvx --from python-semantic-release==10.6.1 --with "gitpython<3.1.60" \
#     semantic-release -c py/tools/semantic-release-go.toml version
# (the `release-go-version` job in release.yml, after the core + fastapi version
# jobs and before the rust one, so the release pipelines never push to main
# concurrently).
#
# A Go library has NO version file — the version IS the `go/v{version}` tag
# (the subdir-module format `go get .../identity-model/go@go/vX.Y.Z` requires).
# So there is no version_toml/version_variables here: semantic-release reads the
# current version from the latest `go/v*` tag and writes only a new tag (plus
# the changelog). The pushed tag triggers .github/workflows/release-go.yml,
# which verifies the build and cuts the GitHub Release.
#
# Only commits scoped "(go)" drive this version (scope routing:
# py/tools/release_parsers.py:GoCommitParser); every other commit belongs to
# another release track.
[tool.semantic_release]
commit_parser = "py/tools/release_parsers.py:GoCommitParser"
tag_format = "go/v{version}"
# 0.x library: a breaking change bumps the minor, not to 1.0.0.
major_on_zero = false
allow_zero_version = true
commit_message = "chore(go): release {version}\n\nAutomatically generated by python-semantic-release"

# Release only from main — no prerelease branch group, so a dispatch from any
# other branch refuses to version rather than minting an rc.
[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog.default_templates]
changelog_file = "go/CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
name = "origin"
type = "github"
