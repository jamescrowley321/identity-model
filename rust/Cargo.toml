[package]
name = "rs-identity-model"
version = "0.6.1"
edition = "2024"
rust-version = "1.96"
description = "Production-grade, RFC-compliant OIDC/OAuth2 client library for Rust"
license = "Apache-2.0"
repository = "https://github.com/jamescrowley321/identity-model"
keywords = ["oidc", "oauth2", "jwt", "openid", "authentication"]
categories = ["authentication", "web-programming"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# jsonwebtoken 10 unbundled its crypto backend. We select `aws_lc_rs` rather
# than `rust_crypto` because the pure-Rust provider pulls the `rsa` crate, which
# carries the unfixable Marvin timing advisory (RUSTSEC-2023-0071, no patched
# release). aws-lc-rs performs RSA verification without it and clears the OSV
# gate. Trade-off accepted: adds a C toolchain (aws-lc/cmake) build dependency.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
sha2 = "0.11.0"
# Constant-time comparison for the ID-Token at_hash/c_hash/nonce checks. Already
# in the tree (a normal transitive dependency via rustls → reqwest), so it adds
# no new supply-chain surface; BSD-3-Clause is on the cargo-deny allowlist.
subtle = "2"
getrandom = "0.4.3"
# DPoP (RFC 9449) key generation, which jsonwebtoken deliberately does not
# provide — it signs with a key but never mints one. p256 generates the EC P-256
# half and converts a JWK's `d` scalar to the PKCS#8 DER `EncodingKey` wants.
p256 = { version = "0.14.0", features = ["pkcs8", "ecdsa"] }
# The RSA half of DPoP key generation, plus JWK-to-key conversion from the
# RFC 7517 CRT members. Already compiled into every build as jsonwebtoken's
# selected crypto backend (see the `aws_lc_rs` note above), so naming it directly
# adds no new supply-chain surface — it only makes `rsa::KeyPair::generate` and
# `rsa::KeyPair::from_components` reachable. The `rsa` crate, which would be the
# obvious alternative, is exactly what the advisory note above rules out.
aws-lc-rs = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
url = "2.5.8"
wiremock = "0.6.5"
# The DPoP live tests attach a proof to the token request by handing
# `TokenClient` a client carrying the `DPoP` header, which needs the same
# reqwest the crate itself uses — already a direct dependency, so naming it here
# adds no supply-chain surface.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Generates the wrong-curve key that `key_strength_is_enforced_by_the_backend`
# feeds the ES256 loader, so the test material is minted at run time rather than
# committed as a private-key file. Sibling of the `p256` dependency above, and
# test-only.
p384 = { version = "0.14.0", features = ["pkcs8"] }
