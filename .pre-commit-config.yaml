# Every hook is a make target, so pre-commit, CI and a manual run all use the
# same definition. `make lint` runs them all.
repos:
  - repo: local
    hooks:
      - id: lint-py
        name: python lint + typecheck (ruff, pyrefly)
        entry: make lint-py
        language: system
        files: ^(py|tools|conformance)/
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
      - id: test-unit
        name: python unit tests (py-identity-model)
        entry: make test-unit
        language: system
        files: ^(py|spec)/
        pass_filenames: false
        require_serial: true
      - id: test-fastapi
        name: python unit tests (fastapi-identity-model)
        entry: make test-fastapi
        language: system
        files: ^(py|spec)/
        pass_filenames: false
        require_serial: true
      - id: lint-go
        name: go lint (vet, golangci-lint)
        entry: make lint-go
        language: system
        files: ^go/
        pass_filenames: false
        require_serial: true
      - id: test-unit-go
        name: go unit tests
        entry: make test-unit-go
        language: system
        files: ^(go|spec)/
        pass_filenames: false
        require_serial: true
      - id: lint-rust
        name: rust lint (rustfmt, clippy)
        entry: make lint-rust
        language: system
        files: ^rust/
        pass_filenames: false
        require_serial: true
      - id: test-unit-rust
        name: rust unit tests
        entry: make test-unit-rust
        language: system
        files: ^(rust|spec)/
        pass_filenames: false
        require_serial: true
