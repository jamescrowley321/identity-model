repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
    rev: v0.14.1
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      - id: pyrefly-check
        name: pyrefly check
        entry: uv run --directory py pyrefly check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
      - id: pytest-coverage
        name: pytest coverage check (80% minimum)
        entry: uv run --directory py pytest src/tests -m unit -q -n auto --cov=src/py_identity_model --cov-report=term-missing:skip-covered --cov-fail-under=80 --ignore=src/tests/benchmarks -p no:benchmark
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: actionlint
        name: actionlint (+ shellcheck on run blocks)
        entry: .github/scripts/lint_workflows.sh
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
        require_serial: true
