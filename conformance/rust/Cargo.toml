[package]
name = "rs-identity-model-conformance"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
description = "OpenID Foundation RP conformance harness for rs-identity-model"
license = "Apache-2.0"
publish = false

[dependencies]
rs-identity-model = { path = "../../rust" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
# Same reqwest and TLS stack as the library, so the client the harness injects
# is the one the library would build itself plus the local suite's root.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# The pinned-certificate verifier for the local suite (see src/tls.rs). Both are
# already in the graph through reqwest's rustls-tls (ring provider, webpki roots).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4.3"
base64 = "0.23"
subtle = "2"
url = "2.5.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6.5"
http-body-util = "0.1"
