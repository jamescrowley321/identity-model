services:
  cert-init:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -f /certs/nginx-selfsigned.crt ] && exit 0
        apk add --no-cache openssl &&
        openssl req -x509 -nodes -days 30 -newkey rsa:2048 \
          -keyout /certs/nginx-selfsigned.key \
          -out /certs/nginx-selfsigned.crt \
          -subj "/CN=localhost.emobix.co.uk" \
          -addext "subjectAltName=DNS:localhost.emobix.co.uk"
    volumes:
      - certs:/certs

  mongodb:
    image: mongo:6.0.13
    volumes:
      - mongodb-data:/data/db

  nginx:
    build:
      context: ./nginx
    ports:
      - "8443:8443"
      - "8444:8444"
    networks:
      default:
        aliases:
          - localhost.emobix.co.uk
    volumes:
      - certs:/certs:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
      server:
        condition: service_healthy

  server:
    # Pinned to a released tag, NOT :latest. :latest is a rolling build off the
    # suite's main branch; between the 2026-08-31 (green) and 2026-09-01 (red)
    # daily runs it drifted to a build that never transitions RP happy-path
    # client tests to FINISHED, so run_tests.py polls them to a 120s TIMEOUT
    # (5 failures in basic-rp) even though the RP completes auth + UserInfo(200)
    # correctly. Pinning makes this gate reproducible. Bump deliberately after
    # verifying a newer release passes locally. Last-known-good: v5.2.4 (2026-08-27).
    image: registry.gitlab.com/openid/conformance-suite:release-v5.2.4
    environment:
      - BASE_URL=https://localhost.emobix.co.uk:8443
      # mTLS endpoints live on a second port; advertise them on the nginx alias
      # host (not the image default localhost:8444) so the RP container can reach
      # them through the proxy for the FAPI 2.0 mtls variant.
      - BASE_MTLS_URL=https://localhost.emobix.co.uk:8444
      - MONGODB_HOST=mongodb
      - SPRING_PROFILES_ACTIVE=dev
      - OIDC_GOOGLE_CLIENTID=dummy
      - OIDC_GOOGLE_SECRET=dummy
      - OIDC_GITLAB_CLIENTID=dummy
      - OIDC_GITLAB_SECRET=dummy
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  rp:
    build:
      context: ..
      dockerfile: conformance/Dockerfile
    ports:
      - "8888:8888"
    environment:
      - RP_HOST=0.0.0.0
      - RP_PORT=8888
      - CONFORMANCE_SUITE_BASE_URL=https://localhost.emobix.co.uk:8443
      # OP-facing address for request_uri (JAR): the OP fetches request objects
      # server-to-server, so it must reach the RP by compose service name.
      - RP_INTERNAL_BASE_URL=http://rp:8888
      - SSL_CERT_FILE=/certs/nginx-selfsigned.crt
    volumes:
      - certs:/certs:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
      nginx:
        condition: service_started
      server:
        condition: service_healthy

  # Same suite, second RP: the fastapi-identity-model package's real
  # build_oidc_router driven through the identical plans (regression stage).
  rp-fastapi:
    build:
      context: ..
      dockerfile: conformance/Dockerfile.fastapi
    ports:
      - "8889:8889"
    environment:
      - RP_BASE_URL=http://localhost:8889
      - CONFORMANCE_SUITE_BASE_URL=https://localhost.emobix.co.uk:8443
      - SSL_CERT_FILE=/certs/nginx-selfsigned.crt
    volumes:
      - certs:/certs:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
      nginx:
        condition: service_started
      server:
        condition: service_healthy

volumes:
  mongodb-data:
  certs:
